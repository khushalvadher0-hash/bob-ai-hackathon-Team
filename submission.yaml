submission: 
  title: "Container Congestion Predictor & Port Operations Optimiser"                             
 
  problem_statement: >
    Ports face severe congestion due to inefficient manual allocation of berths and cranes,
    leading to delays, increased costs, and disrupted supply chains. Port operators lack real-time
    predictive insights to anticipate congestion and optimize resource utilization. This solution
    aims to predict congestion levels and provide intelligent allocation and routing recommendations to improve port operations.
 
  solution_summary: >
    We built a lightweight AI-driven system that analyzes vessel schedules and port capacity data
    to predict congestion levels and optimize resource allocation. The system provides berth and crane
    assignments, suggests alternate routing strategies, and generates a 72-hour operational plan to
    support faster and smarter port decision-making.
 
  key_features:
    - "Congestion level prediction (High / Medium / Low) based on vessel inflow and port capacity"
    - "Automated berth allocation based on arrival time and priority"
    - "Crane assignment based on vessel size for efficient handling"
    - "Alternate routing recommendations during high congestion"
    - "72-hour operational planning dashboard for port supervisors"
 
  tech_stack: 
    languages: ["Python", "JavaScript"]                      
    frameworks: ["FastAPI", "React", "Tailwind CSS"]                     
    ibm_technologies: ["IBM Bob"]               
    databases: ["JSON (File-based)"]                     
    other: ["Git", "Postman", "Vite"]                          
 
  what_we_are_most_proud_of: >
    We are most proud of delivering a complete working prototype within a short time that clearly
    demonstrates real-world impact. The system combines simple yet effective decision logic with a
    clean and intuitive UI, making complex port operations easy to understand and act upon.
 
  known_limitations: >
    The current system uses simulated data and rule-based logic instead of real-time AIS data and
    advanced machine learning models. Features like live tracking, weather integration, and dynamic
    optimization are not implemented due to time constraints but can be added in future versions.
 
